app:
  id: ari:cloud:ecosystem::app/b4c24b0d-2782-4ef2-8f9c-60fae57db5b3
  connect:
    key: mermaid-chart-app-for-jira
    remote: connect
  runtime:
    name: nodejs24.x
remotes:
  - key: connect
    baseUrl: https://jira.mermaidchart.com
    operations:
      - compute
      - fetch
    auth:
      appUserToken:
        enabled: true
modules:
  jira:issuePanel:
    - key: jira-issue-content
      resource: panel
      resolver:
        function: resolver
      title: Mermaid Chart
      icon: resource:panel;icon_80x80.png
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: panel
    path: static/panel
  - key: dialog
    path: static/dialog
permissions:
  scopes:
    - read:app-user-token
    # Issue property "diagrams", attachment content (thumbnails).
    - read:jira-work
    # Issue property "diagrams", user property "token", add and delete attachments.
    - write:jira-work
    # User property "token".
    - read:jira-user
  content:
    styles:
      - unsafe-inline
  external:
    # mermaidchart.com page routes (including /oauth/frame) 301 to mermaid.ai, and the
    # browser checks the redirect target too, so both domains must be listed.
    frames:
      - https://mermaidchart.com
      - https://*.mermaidchart.com
      - https://mermaid.ai
      - https://*.mermaid.ai
    fetch:
      backend:
        - remote: connect
      client:
        - https://mermaidchart.com
        - https://*.mermaidchart.com
        - https://mermaid.ai
        - https://*.mermaid.ai
    # public/css/issue-content.css loads the Recursive font, as the Connect panel did.
    styles:
      - https://fonts.googleapis.com
    fonts:
      - https://fonts.gstatic.com
